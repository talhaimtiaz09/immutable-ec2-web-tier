# Terraform for envs/lab.
#
#   pull_request -> checks (fmt, validate, tflint, trivy) -> plan with the
#                   read-only plan role -> plan posted as a PR comment
#   push to main -> apply with the apply role, inside the `lab` GitHub
#                   Environment (required reviewer, main branch only), then
#                   scripts/rollout.sh starts the instance refresh
#
# AWS access is GitHub OIDC only (id-token: write); there are no AWS keys in
# secrets. Repository variables (Settings -> Secrets and variables -> Variables),
# all from `terraform output` in terraform/bootstrap:
#   AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN, TF_STATE_BUCKET, ALARM_EMAIL
#
# Actions are pinned to full commit SHAs (tag in the trailing comment).

name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "scripts/rollout.sh"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - "scripts/rollout.sh"

permissions:
  contents: read

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TRIVY_VERSION: "v0.75.0"
  AWS_REGION: "us-east-1"
  TF_IN_AUTOMATION: "true"

jobs:
  checks:
    name: fmt / validate / tflint / trivy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend) and validate
        run: |
          for root in bootstrap envs/lab; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download rate limit
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/terraform/.tflint.hcl" --format compact

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      # Deliberate lab trade-offs are suppressed inline (#trivy:ignore:<ID> <reason>).
      - name: trivy config
        run: trivy config --exit-code 1 .

  plan:
    name: plan (lab)
    needs: checks
    # Fork PRs get no OIDC token; plans only run for branches in this repo.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> plan role (sub = repo:<repo>:pull_request)
      pull-requests: write # plan comment
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: terraform/envs/lab
    env:
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=lab.tfvars -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:envs/lab -->';
            let plan = fs.readFileSync('terraform/envs/lab/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = '... (truncated, full plan in the job log)\n' + plan.slice(-max);
            }
            const status = { '0': 'no changes', '2': 'changes', '1': 'FAILED' }[process.env.PLAN_EXIT] ?? 'unknown';
            const body = [
              marker,
              `### Terraform plan: \`envs/lab\` (${status})`,
              `Commit ${context.sha.substring(0, 7)}, [run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  apply:
    name: apply (lab)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment gates the job on a required reviewer and changes the OIDC
    # sub claim to repo:<repo>:environment:lab, which is what the apply role trusts.
    environment: lab
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-lab
      cancel-in-progress: false # never cancel an apply mid-run
    defaults:
      run:
        working-directory: terraform/envs/lab
    env:
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"

      # Re-plan on the merged commit and apply exactly that saved plan.
      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -var-file=lab.tfvars -out=tfplan

      - name: Apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      # Terraform only creates the new launch template version. This rolls the
      # fleet onto it with alarm-gated auto rollback, and fails the job if AWS
      # rolled back.
      - name: Roll out
        run: ../../../scripts/rollout.sh
